<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- shoulders / orange shirt -->
  <path d="M9 64 Q11 45 25 43.5 L39 43.5 Q53 45 55 64 Z" fill="#f97316"/>
  <!-- collar -->
  <path d="M25 43.5 L32 50 L27 53 L23.5 45 Z" fill="#ea580c"/>
  <path d="M39 43.5 L32 50 L37 53 L40.5 45 Z" fill="#ea580c"/>
  <!-- tie -->
  <path d="M32 48 L29.4 51.5 L32 62.5 L34.6 51.5 Z" fill="#9f1239"/>
  <path d="M29.8 46.5 L34.2 46.5 L32 50.2 Z" fill="#be123c"/>
  <!-- neck -->
  <rect x="27.2" y="35" width="9.6" height="10.5" rx="3.4" fill="#eec39a"/>
  <!-- ears -->
  <circle cx="15.6" cy="26.5" r="3.4" fill="#f6d7b8"/>
  <circle cx="48.4" cy="26.5" r="3.4" fill="#f6d7b8"/>
  <!-- head -->
  <ellipse cx="32" cy="25.5" rx="15.6" ry="17" fill="#f6d7b8"/>
  <!-- platinum hair: short cap, high forehead, spiky top -->
  <path d="M16.4 26 Q15.4 11 23 7.6 L24.6 4.6 L27 6.9 L29.5 4 L32 6.6 L34.5 4 L37 6.9 L39.4 4.6 L41 7.6 Q48.6 11 47.6 26 Q46.4 14.2 32 14.2 Q17.6 14.2 16.4 26 Z" fill="#f7ecc4"/>
  <!-- eyebrows -->
  <path d="M22.8 22.4 Q26 20.7 28.8 22.1" stroke="#dfc08e" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <path d="M35.2 22.1 Q38 20.7 41.2 22.4" stroke="#dfc08e" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="26.2" cy="26" rx="1.7" ry="2.2" fill="#312e2b"/>
  <ellipse cx="37.8" cy="26" rx="1.7" ry="2.2" fill="#312e2b"/>
  <!-- nose -->
  <path d="M32 26.5 Q30.9 30.4 32.6 31.4" stroke="#e0b186" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- big smile with teeth -->
  <path d="M24.8 34 Q32 41.2 39.2 34 Q32 36.6 24.8 34 Z" fill="#8c3318"/>
  <path d="M26.4 34.4 Q32 36.5 37.6 34.4 Q32 38.2 26.4 34.4 Z" fill="#ffffff"/>
</svg>
